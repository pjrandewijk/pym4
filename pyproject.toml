[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pym4"
version = "1.0.0"
description = "A GNU m4 1.4 compatible macro processor in pure Python"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Peter Jan Randewijk" }]
requires-python = ">=3.10"
keywords = ["m4", "gnu m4", "macro processor", "preprocessor", "circuit macros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/pjrandewijk/pym4"
Issues = "https://github.com/pjrandewijk/pym4/issues"
"Used by" = "https://github.com/pjrandewijk/m4cmpy"

[project.scripts]
pym4 = "pym4:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pym4"]
